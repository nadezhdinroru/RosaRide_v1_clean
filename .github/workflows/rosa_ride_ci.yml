name: RosaRide CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies (если появятся)
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "package.json отсутствует — пропускаем установку зависимостей"
          fi

      - name: Build project (если появится сборка)
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "build скрипта нет — проект статический"
          fi

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v3
        with:
          name: rosa_ride_build
          path: |
            .
          retention-days: 2

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: rosa_ride_build

      - name: Deploy via FTP/SFTP (позже подключим сервер)
        run: echo "Этап деплоя подключим, когда будем выкладывать на сервер."
