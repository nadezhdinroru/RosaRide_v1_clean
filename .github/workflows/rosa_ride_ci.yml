name: RosaRide CI/CD

on:
  push:
    branches: 
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "Checking files..."
          ls -la
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Structure OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosa_ride_build
          path: |
            .
          retention-days: 5

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy (placeholder)
        run: |
          echo "Проект проверен и готов к деплою"
