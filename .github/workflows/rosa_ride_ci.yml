name: RosaRide CI/CD

on:
  push:
    branches: 
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "===== Проверка структуры проекта ====="
          ls -la

          echo "[1] Проверка core-файлов"
          test -f index.html
          test -f style.css
          test -f script.js

          echo "[2] Проверка папки assets"
          test -d assets
          test -d assets/icons
          test -d assets/logo

          echo "[3] Проверка отсутствия пустых файлов"
          for f in $(find . -type f -size 0); do
            echo "ПУСТОЙ ФАЙЛ: $f" && exit 1;
          done

          echo "[OK] Проект корректный, ошибок нет"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosa_ride_build
          path: |
            .
          retention-days: 5

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy (placeholder)
        run: |
          echo "Проект проверен и готов к деплою"
